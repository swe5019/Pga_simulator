name: Fetch NFL prop lines

# Lines move all week, so this runs often. Each run also archives a dated
# snapshot: DraftKings cut this project off from exact contest payouts without
# warning, and if Underdog does the same the archive is the difference between
# losing new lines and losing the history too.
on:
  schedule:
    - cron: '20 13 * * *'   # daily, mid-morning ET
    - cron: '20 21 * * *'   # daily, evening ET
    # Sunday morning, repeatedly, because ONE run before the main slate is not
    # enough. GitHub's scheduler is best-effort and drifts under load: the
    # 16:20 run meant to land 100 minutes before a 1pm ET lock actually fired
    # at 18:27 UTC, after kickoff, by which point the market had pulled the
    # lines for players already in live games and the slate failed its own
    # minimum-size check. The last projection standing was therefore from
    # Saturday evening, which still had Breece Hall as the Jets starter while
    # the field was 18.5% on Braelon Allen.
    #
    # With the daily 13:20 run, that is three Sunday attempts, so a two-hour
    # delay still leaves a usable build. A run
    # that lands after kickoff fails the population check and commits nothing,
    # so the extra attempts cannot overwrite a good build with a broken one.
    - cron: '20 15 * * 0'   # Sunday 10:20am ET
    - cron: '20 16 * * 0'   # Sunday 11:20am ET, closest to a 1pm lock
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-props
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Only the simulation needs this. Everything else in the props pipeline
      # is standard library on purpose, so a numpy problem cannot take the
      # lines, the hit rates or the matchups down with it.
      - name: Install numpy
        run: pip install numpy

      # Who is not playing. This is the only feed here that is forward
      # looking, and without it the whole pipeline is blind to the one thing
      # that moves a prop line most: somebody ahead of a player being ruled
      # out. Runs before the hit rates, because they read the roles it implies.
      - name: Fetch injury report
        env:
          PYTHONUNBUFFERED: '1'
        continue-on-error: true
        run: python tools/fetch_nfl_injuries.py

      - name: Fetch prop lines
        env:
          PYTHONUNBUFFERED: '1'
        run: python tools/fetch_props.py

      # How each defense has treated each position in each stat, opponent
      # adjusted. Rebuilt here rather than in the weekly stats job so it always
      # reflects whatever season files are currently committed.
      - name: Build matchup multipliers
        env:
          PYTHONUNBUFFERED: '1'
        run: python tools/build_matchups.py

      # Attaches L1/L2/L3 hit rates against each line, from the season files
      # already in the repo. No historical odds are needed: "under in 3 of 4"
      # is just counting past games against today's line.
      - name: Attach hit rates
        env:
          PYTHONUNBUFFERED: '1'
        run: python tools/enrich_props.py

      # Plays the game out at the play level and attaches SIM% to each line.
      # Runs last because it rewrites the file the page loads, and it is the
      # only step that can be dropped without taking anything else with it: a
      # failure here leaves every line, price, hit rate and matchup intact and
      # simply shows no SIM% column.
      - name: Simulate props
        env:
          PYTHONUNBUFFERED: '1'
        continue-on-error: true
        run: python tools/simulate_props.py

      # Fantasy point projections, which depend on the props being enriched and
      # simulated first because that is where the de-vigged prices come from.
      # Allowed to fail without taking the props down with it.
      - name: Build fantasy projections
        env:
          PYTHONUNBUFFERED: '1'
        continue-on-error: true
        run: python tools/build_projections.py

      # The DraftKings slate board, which needs the projections finished first.
      - name: Build slate board
        env:
          PYTHONUNBUFFERED: '1'
        continue-on-error: true
        run: python tools/build_nfl_slate.py

      # The tournament field simulation, which needs the board's ownership.
      - name: Simulate the contest field
        env:
          PYTHONUNBUFFERED: '1'
        continue-on-error: true
        run: python tools/build_contest.py

      # IS THE RIGHT SET OF PLAYERS ON THE BOARD. Everything else here checks
      # arithmetic, and all of it was passing while four separate population
      # bugs were live: a star silently dropped, a retired quarterback
      # projected off a 2024 roster, players whose lines had been pulled still
      # projected, and a man on injured reserve picked into optimizer lineups.
      # Not one was a wrong number, so nothing could see them.
      #
      # This one FAILS THE JOB rather than carrying on, and it runs before the
      # commit, so a bad population leaves the previous good data live instead
      # of replacing it. Stale is recoverable; wrong and published is not.
      - name: Verify the player population
        env:
          PYTHONUNBUFFERED: '1'
        run: python tools/verify_population.py

      # The baseline records what the last run produced, and the check writes a
      # fresh one on purpose even when it fails. That intent was defeated here:
      # the commit below is skipped on failure, so the baseline froze at the
      # last good build and every later run compared against an ever staler
      # population. One legitimate failure — the prop feed rolling to a new
      # game week — wedged this pipeline for four days and eight runs.
      #
      # Committing it regardless cannot ratchet a real breakage past the gate,
      # because the checks that establish correctness (nobody off a roster,
      # nobody who stopped playing, nobody the market prices left out, every
      # team fielding a side) are absolute and do not consult the baseline.
      # Only the change detector does, and a change detector that cannot move
      # its reference point is a change detector that jams.
      - name: Record the population baseline
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/population_baseline.json
          if git diff --cached --quiet; then
            echo "Baseline unchanged"
          else
            git commit -m "Record the projected player population"
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin main || true
              sleep $((i * 3))
            done
          fi

      - name: Commit props
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nfl_props.json data/nfl_props_full.json data/nfl_matchups.json data/nfl_injuries.json data/nfl_projections.json data/nfl_slate_board.json data/nfl_contest.json data/population_baseline.json data/ownership_history data/props_history
          if git diff --cached --quiet; then
            echo "No change in prop lines"
          else
            git commit -m "Auto-update NFL prop lines"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "pushed on attempt $i"
                exit 0
              fi
              echo "push rejected, rebasing and retrying ($i)"
              git pull --rebase origin main || exit 1
              sleep $((i * 3))
            done
            echo "could not push after 5 attempts"
            exit 1
          fi

      # AFTER the props commit, deliberately. The scenario pass is the slowest
      # thing here and the least load bearing: it is a reading of the board,
      # not the board. Running it earlier would put props, projections, the
      # slate board and the contest simulation behind it, and this pipeline has
      # already been wedged twice by exactly that shape, once by a churn check
      # and once by a single unrostered rookie. The core data is published by
      # the time this runs, so a failure here is visible in the job without
      # costing anybody their numbers.
      - name: Discover winning scenarios
        env:
          PYTHONUNBUFFERED: '1'
        run: python tools/discover_scenarios.py --trials 2500 --field 4000 --top 12

      - name: Commit scenarios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nfl_scenarios.json
          if git diff --cached --quiet; then
            echo "No change in scenarios"
          else
            git commit -m "Auto-update NFL game stack scenarios"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "pushed on attempt $i"
                exit 0
              fi
              echo "push rejected, rebasing and retrying ($i)"
              git pull --rebase origin main || exit 1
              sleep $((i * 3))
            done
            echo "could not push after 5 attempts"
            exit 1
          fi
