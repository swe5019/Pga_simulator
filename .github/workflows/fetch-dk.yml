name: Fetch DK salaries

on:
  # Auto-discover the current main PGA slate a few times a day. DK posts the
  # next event's contests Mon/Tue, so this picks up salaries on its own with no
  # manual contest id. Runs that find no new slate exit cleanly (no commit).
  schedule:
    - cron: '0 13,17,21 * * *'   # 3x/day (UTC)
  workflow_dispatch:
    inputs:
      auto:
        description: Auto-discover the current main PGA slate (1 = on; ignores ids/name)
        required: false
        default: ''
      contest_id:
        description: DraftKings contest ID (optional if draftgroup_id given)
        required: false
        default: ''
      draftgroup_id:
        description: DraftKings draft group ID (optional; overrides contest)
        required: false
        default: ''
      tournament_name:
        description: Tournament_Name value (optional in auto mode)
        required: false
        default: ''
      date:
        description: Date value (optional in auto mode)
        required: false
        default: ''
      results_contest_id:
        description: Pull real ownership from this COMPLETED contest id (needs DK_COOKIE secret)
        required: false
        default: ''
      results_find:
        description: 'Or match a completed contest by name, e.g. "Caddie" (uses dk_contests.json)'
        required: false
        default: ''
      list:
        description: List open GOLF draft groups instead of fetching (1 = list)
        required: false
        default: ''
      refresh_contests:
        description: Force-rebuild the DK contest list (1 = on)
        required: false
        default: ''
      find_contest:
        description: 'Diagnostic: search the GOLF lobby for a contest name (e.g. Caddie)'
        required: false
        default: ''
      probe_contest:
        description: Probe a contest ID for payout endpoints (diagnostic only)
        required: false
        default: ''
      probe_dg:
        description: Probe payouts for real contests of a draft group (diagnostic)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fetch-dk
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch DraftKings salaries
        env:
          # Without this Python buffers stdout but not stderr, so on a crash the
          # traceback lands far above the prints that led to it and the log reads
          # out of order. Unbuffered keeps cause next to effect.
          PYTHONUNBUFFERED: '1'
          # Schedule runs are always auto; manual runs use the 'auto' input.
          DK_AUTO: ${{ github.event_name == 'schedule' && '1' || inputs.auto }}
          DK_CONTEST_ID: ${{ inputs.contest_id }}
          DK_DRAFTGROUP_ID: ${{ inputs.draftgroup_id }}
          DK_TOURNAMENT: ${{ inputs.tournament_name }}
          DK_DATE: ${{ inputs.date }}
          DK_LIST: ${{ inputs.list }}
          DK_REFRESH_CONTESTS: ${{ inputs.refresh_contests }}
          DK_FIND_CONTEST: ${{ inputs.find_contest }}
          DK_PROBE_CONTEST: ${{ inputs.probe_contest }}
          DK_PROBE_DG: ${{ inputs.probe_dg }}
          # Post-contest ownership (results mode) — needs the DK_COOKIE secret.
          DK_RESULTS_CONTEST: ${{ inputs.results_contest_id }}
          DK_RESULTS_FIND: ${{ inputs.results_find }}
          DK_COOKIE: ${{ secrets.DK_COOKIE }}
        # Tee'd to a file as well as the log. GitHub serves workflow logs from
        # a storage host that the API client here will not follow, so when this
        # step fails the reason is effectively unreadable without opening the
        # Actions tab by hand. Three dispatches were spent guessing at a
        # failure that turned out to be a missing required input. The last run
        # is committed on failure so the reason is in the repository.
        run: |
          set -o pipefail
          python tools/fetch_dk.py 2>&1 | tee /tmp/dk.log

      # A manual run always leaves its output behind, not just a failed one,
      # because the diagnostic modes (list, find_contest, probe) succeed and
      # print their findings to a log that cannot be read from here. Scheduled
      # runs are excluded so this does not commit on every cron tick.
      - name: Record what this run did
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p data
          {
            echo "DK run at $(date -u +%Y-%m-%dT%H:%M:%SZ) — ${{ job.status }}"
            echo "run: ${{ github.run_id }}  event: ${{ github.event_name }}"
            echo "inputs: tournament='${{ inputs.tournament_name }}' date='${{ inputs.date }}' dg='${{ inputs.draftgroup_id }}' contest='${{ inputs.contest_id }}' auto='${{ inputs.auto }}' list='${{ inputs.list }}'"
            echo "---- output (tail 400) ----"
            tail -n 400 /tmp/dk.log 2>/dev/null || echo "(no output captured)"
          } > data/dk_last_run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dk_last_run.txt
          git diff --cached --quiet || git commit -m "Record what the manual DK run did"
          for i in 1 2 3; do git push && break; git pull --rebase origin main || true; sleep 3; done

      - name: Commit CSV
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dk_salaries.csv data/dk.json data/dk_showdown.json data/dk_contests.json data/actual_ownership.json
          if git diff --cached --quiet; then
            echo "No change in DK data"
          else
            git commit -m "Fetch DK data (salaries / status / results ownership)"
            # The data workflows all push to main and can overlap (a schedule firing
            # while a push-triggered run is mid-flight), so a plain push loses the race
            # and fails the job after the fetch already succeeded. Rebase and retry.
            for i in 1 2 3 4 5; do
              if git push; then
                echo "pushed on attempt $i"
                exit 0
              fi
              echo "push rejected, rebasing and retrying ($i)"
              git pull --rebase origin main || exit 1
              sleep $((i * 3))
            done
            echo "could not push after 5 attempts"
            exit 1
          fi
