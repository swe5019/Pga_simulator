<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- Square (no radius) so avatar uploads that apply their own crop stay clean -->
  <rect width="100" height="100" fill="#0e1116"/>
  <!-- Outcome distribution: the shape every SlateSims projection comes out of -->
  <path d="M10,79 C31,79 31,38 50,38 C69,38 69,79 90,79 Z" fill="#3fb950" opacity=".22"/>
  <path d="M10,79 C31,79 31,38 50,38 C69,38 69,79 90,79" fill="none" stroke="#3fb950"
        stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pin planted on the peak -->
  <rect x="46.8" y="9" width="6.4" height="37" rx="3.2" fill="#e6edf3"/>
  <polygon points="53.2,11 76,19 53.2,27" fill="#e6edf3"/>
</svg>
